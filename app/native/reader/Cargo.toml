[package]
name = "clave-reader"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "clave-reader"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# The Apple frameworks are only reachable on macOS. Every other target builds the
# platform-neutral half of the crate plus a stub platform, so `cargo test` works anywhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"

# Windows: Win32 for the window and session questions, WinRT for capture (Windows.Graphics.Capture)
# and recognition (Windows.Media.Ocr), the two system components that play Apple's parts there.
# The Wdk, Registry, Shell, Globalization and UserProfile features are for one question only: which
# language Chrome's interface is in (`src/win/chrome.rs`).
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "System_UserProfile",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Linux reads the focused window through a GNOME Shell extension and the ScreenCast portal (both over
# the session bus) and receives the frames from PipeWire. Tesseract is called through a small
# hand-written FFI in `src/linux`, so it needs no crate.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.1"
zbus = "5.19.0"

[profile.release]
opt-level = 3
# `panic = "abort"` is deliberately NOT set: the helper turns a panic in any thread into
# exit code 70 with `E_PANIC`, which needs the unwinding runtime.
panic = "unwind"
